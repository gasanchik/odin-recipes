    <h1>couscous</h1>
    <a href="../index.html">

    <h3>ingredients</h3>
    <ul>
        <li>one glemulock</li>
        <li>five teaspoons of effescence</li>
        <li>one unicorn horn</li>
        <li>1kg rice</li>
    </ul>

    <h3>recipe</h3>
    <ol>
        <li>chop glemulock up and wait for him to stop screaming</li>
        <li>cook at 50 C for ten minutes with oil</li>
        <li>pour effescence on his <em>mouth</em></li>
        <li>cook rice</li>
        <li><strong>serve and enjoy!</strong></li>
    </ol>
